version: "3.9"

services:
   db:
      image: postgres:14.1-alpine
      restart: always
      environment:
         - POSTGRES_USER=${DB_USER}
         - POSTGRES_PASSWORD=${DB_PASSWORD}
         - POSTGRES_DB=${DB_NAME}
      ports:
         - "5432:5432"
      volumes:
         - db:/var/lib/postgresql/data
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
         interval: 5s
         timeout: 5s
         retries: 10

   api:
      image: ghcr.io/evgeny-kovalev/doors-backend:${IMAGE_TAG:-latest}
      build:
         context: .
         dockerfile: Dockerfile
      container_name: doors-backend
      restart: unless-stopped
      env_file:
         - .env
      ports:
         - "4000:4000"
      depends_on:
         db:
            condition: service_healthy

volumes:
   db:
